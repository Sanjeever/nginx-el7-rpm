name: Build EL7 RPM
run-name: Build Nginx ${{ inputs.version }} for EL7

on:
  workflow_dispatch:
    inputs:
      version:
        description: Nginx 版本号（例如 1.31.9）
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build CentOS 7.9 image
        run: docker build --platform linux/amd64 --tag nginx-el7-builder .

      - name: Build and test RPM
        shell: bash
        env:
          NGINX_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/nginx-el7-rpm"
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,source=$RUNNER_TEMP/nginx-el7-rpm,target=/out" \
            nginx-el7-builder "$NGINX_VERSION" 2>&1 | tee "$RUNNER_TEMP/nginx-el7-rpm/build.log"

      - name: Upload RPM and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nginx-${{ inputs.version }}-el7-x86_64
          path: ${{ runner.temp }}/nginx-el7-rpm/
          if-no-files-found: error
